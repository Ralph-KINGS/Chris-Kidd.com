<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Montserrat", sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="44.5"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="a-roll"
        class="clip"
        src="assets/chris-src.mp4"
        playsinline
        data-start="0"
        data-duration="40.7"
        data-track-index="0"
        style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover" data-has-audio="true"></video>

      <audio
        id="music"
        class="clip"
        src="assets/bgm/bed.mp3"
        data-start="0"
        data-duration="44.5"
        data-track-index="3"
        data-volume="1"
        data-fade-in="1.5"
        data-fade-out="2"
        data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0.04},{&quot;t&quot;:38.1,&quot;v&quot;:0.04},{&quot;t&quot;:39.1,&quot;v&quot;:0.16}]}]}"
      ></audio>
      <div
        id="callouts"
        data-composition-id="callouts"
        data-composition-src="compositions/callouts.html"
        data-start="8"
        data-duration="9.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>
      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="38.3"
        data-duration="6.2"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
