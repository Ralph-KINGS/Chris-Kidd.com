<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Montserrat", sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="13.1"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="a-roll"
        class="clip"
        src="assets/clip-src.mp4"
        playsinline
        data-start="0"
        data-duration="7.36"
        data-track-index="0"
        data-has-audio="true"
        style="position: absolute; left: 0; top: 140px; width: 1080px; height: 1456px; object-fit: cover; z-index: 1"
      ></video>
      <audio
        id="music"
        class="clip"
        src="assets/bgm/bed.mp3"
        data-start="0"
        data-duration="13.1"
        data-track-index="3"
        data-volume="1"
        data-fade-in="1"
        data-fade-out="1.5"
        data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0.07},{&quot;t&quot;:6.8,&quot;v&quot;:0.07},{&quot;t&quot;:7.6,&quot;v&quot;:0.3}]}]}"
      ></audio>
      <div
        id="frame"
        data-composition-id="frame"
        data-composition-src="compositions/frame.html"
        data-start="0"
        data-duration="7.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>
      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="6.9"
        data-duration="6.2"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
